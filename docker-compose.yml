services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: conflow_db
      POSTGRES_USER: conflow_user
      POSTGRES_PASSWORD: conflow_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflow_user -d conflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: conflow_db
      DB_USER: conflow_user
      DB_PASSWORD: conflow_password
      # Optional for auth routes; set real values for Supabase integration.
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  rag:
    build:
      context: .
      dockerfile: packages/rag/Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://conflow_user:conflow_password@db:5432/conflow_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
      rag:
        condition: service_started

  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: conflow-vllm-engine
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.90
      --enable-prompt-caching

volumes:
  db_data:
