version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: conflow_db
      POSTGRES_USER: conflow_user
      POSTGRES_PASSWORD: conflow_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflow_user -d conflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://conflow_user:conflow_password@db:5432/conflow_db
    depends_on:
      db:
        condition: service_healthy

  rag:
    build:
      context: .
      dockerfile: packages/rag/Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://conflow_user:conflow_password@db:5432/conflow_db
      OPENAI_API_KEY: "YOUR_OPENAI_API_KEY" # IMPORTANT: Replace with your actual OpenAI API Key
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: always
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
      rag:
        condition: service_started

volumes:
  db_data: