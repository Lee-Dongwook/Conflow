[project]
name = "vector-rag"
version = "0.1.0"
description = "Vector RAG library for Conflow (pgvector + optional cache)"
requires-python = ">=3.13"
dependencies = [
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "numpy>=1.26.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
