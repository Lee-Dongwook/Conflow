[project]
name = "conflow-server"
version = "0.1.0"
description = "Conflow Server"
authors = [{ name = "DongWook lee", email = "dlehddnr0713@gmail.com" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.0",
    "celery>=5.5.3",
    "docling>=2.69.1",
    "docling-core[chunking-openai]>=2.60.0",
    "fastapi (>=0.115.8,<0.130.0)",
    "psycopg[binary,pool] (>=3.2.9,<4.0.0)",
    "scalar-fastapi>=1.2.3",
    "starlette>=0.40.1",
    "supabase (>=2.15.0,<3.0.0)",
    "uvicorn (>=0.35.0,<0.45.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.0.0",
    "email-validator>=2.3.0",
    "mcp>=1.27.0",
    "humps>=0.2.2",
    "structlog>=25.5.0",
    "alembic>=1.18.4",
]

[dependency-groups]
agent = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "respx>=0.22.0",
    "langgraph-cli[inmem]>=0.3.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "default", extra = "gpu" }, 
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "default", extra = "gpu" }, 
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"
explicit = true


[project.optional-dependencies]
cpu = [
    "torch>=2.7.0",
    "torchvision>=0.22.0"
]
gpu = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["main.py", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.10"
